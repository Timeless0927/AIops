name: console-image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/aiops_console_web/**
      - deploy/k8s/console/**
      - .github/workflows/console-image.yml
      - .github/workflows/promote-console.yml
  push:
    branches: [main]
    paths:
      - apps/aiops_console_web/**
      - deploy/k8s/console/**
      - .github/workflows/console-image.yml
      - .github/workflows/promote-console.yml

permissions:
  contents: read

env:
  IMAGE: registry.cn-hangzhou.aliyuncs.com/timelessmao/aiops-console

jobs:
  build-console:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/aiops_console_web/package-lock.json

      - name: Install, test, and build Console
        working-directory: apps/aiops_console_web
        run: |
          npm ci
          npm test
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build Console image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: apps/aiops_console_web
          file: apps/aiops_console_web/Dockerfile
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          provenance: false
          sbom: false
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Register immutable candidate tag
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: docker buildx imagetools create --tag "${IMAGE}:candidate-${GITHUB_SHA}" "${IMAGE}@${DIGEST}"

      - name: Summarize immutable image
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ github.sha }} -> ${IMAGE}@${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
