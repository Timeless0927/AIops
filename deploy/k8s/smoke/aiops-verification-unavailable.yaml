# O01 real alert-path fixture. The impossible node label makes the Deployment
# genuinely unavailable without relying on a fake metric or a pull failure.
# Apply:
#   kubectl apply -f deploy/k8s/smoke/aiops-verification-unavailable.yaml
# Resolve:
#   kubectl -n aiops-system scale deployment aiops-verification --replicas=0
# Cleanup:
#   kubectl delete -f deploy/k8s/smoke/aiops-verification-unavailable.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-verification
  namespace: aiops-system
  labels:
    app.kubernetes.io/name: aiops-verification
    app.kubernetes.io/component: smoke-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aiops-verification
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiops-verification
    spec:
      nodeSelector:
        aiops.example.com/verification-target: unavailable
      containers:
        - name: verification
          image: registry.cn-hangzhou.aliyuncs.com/timelessmao/aiops-gateway@sha256:680cda91c8d5625976c7d4bf5f956bd42954e31d93b0441bbad9ebedf8215d24
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
