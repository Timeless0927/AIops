apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-loki
  namespace: aiops
  labels:
    app.kubernetes.io/name: aiops-loki
    app.kubernetes.io/part-of: aiops-sre-agent
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-loki-config
  namespace: aiops
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
    common:
      instance_addr: 127.0.0.1
      path_prefix: /var/loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage_config:
      tsdb_shipper:
        active_index_directory: /var/loki/tsdb-index
        cache_location: /var/loki/tsdb-cache
      filesystem:
        directory: /var/loki/chunks
    limits_config:
      retention_period: 168h
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      max_query_parallelism: 2
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
      compaction_interval: 10m
      retention_delete_delay: 2h
      retention_delete_worker_count: 10
    query_range:
      align_queries_with_step: true
      max_retries: 5
      cache_results: false
    analytics:
      reporting_enabled: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aiops-loki-data
  namespace: aiops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-loki
  namespace: aiops
  labels:
    app.kubernetes.io/name: aiops-loki
    app.kubernetes.io/part-of: aiops-sre-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aiops-loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiops-loki
        app.kubernetes.io/part-of: aiops-sre-agent
    spec:
      serviceAccountName: aiops-loki
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loki
          image: docker.m.daocloud.io/grafana/loki@sha256:cd6e176883a90c21755f0315688668991634143423f75bdedfef41441b0fdc3c
          imagePullPolicy: IfNotPresent
          args:
            - -target=all
            - -config.file=/etc/loki/loki.yaml
          ports:
            - name: http
              containerPort: 3100
            - name: grpc
              containerPort: 9096
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/loki/loki.yaml
              subPath: loki.yaml
              readOnly: true
            - name: data
              mountPath: /var/loki
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
        - name: storage-metrics
          image: registry.cn-hangzhou.aliyuncs.com/timelessmao/aiops-gateway@sha256:680cda91c8d5625976c7d4bf5f956bd42954e31d93b0441bbad9ebedf8215d24
          imagePullPolicy: IfNotPresent
          command: ["python3", "-c"]
          args:
            - |
              from apps.service_http import JsonHandler, serve

              class StorageMetricsHandler(JsonHandler):
                  def do_GET(self):
                      if self.is_metrics_request():
                          self.write_metrics("aiops-loki")
                          return
                      if self.path == "/healthz":
                          self.write_json(200, {"status": "ok"})
                          return
                      self.write_not_found()

              serve(StorageMetricsHandler, host="0.0.0.0", port=9100)
          env:
            - name: AIOPS_DATA_DIR
              value: /var/loki
          ports:
            - name: storage-metrics
              containerPort: 9100
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/loki
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: storage-metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: storage-metrics
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: aiops-loki-config
        - name: data
          persistentVolumeClaim:
            claimName: aiops-loki-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-loki
  namespace: aiops
  labels:
    app.kubernetes.io/name: aiops-loki
    app.kubernetes.io/part-of: aiops-sre-agent
spec:
  selector:
    app.kubernetes.io/name: aiops-loki
  ports:
    - name: http
      port: 3100
      targetPort: http
    - name: storage-metrics
      port: 9100
      targetPort: storage-metrics
