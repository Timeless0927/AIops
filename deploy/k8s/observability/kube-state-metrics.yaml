apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-kube-state-metrics
  namespace: aiops
  labels:
    app.kubernetes.io/name: aiops-kube-state-metrics
    app.kubernetes.io/part-of: aiops-sre-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aiops-kube-state-metrics
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aiops-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: aiops-kube-state-metrics
    namespace: aiops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aiops-kube-state-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-kube-state-metrics
  namespace: aiops
  labels:
    app.kubernetes.io/name: aiops-kube-state-metrics
    app.kubernetes.io/part-of: aiops-sre-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aiops-kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiops-kube-state-metrics
        app.kubernetes.io/part-of: aiops-sre-agent
    spec:
      serviceAccountName: aiops-kube-state-metrics
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics@sha256:2bbc915567334b13632bf62c0a97084aff72a36e13c4dabd5f2f11c898c5bacd
          imagePullPolicy: IfNotPresent
          args:
            - --resources=pods,deployments,replicasets,statefulsets,daemonsets,jobs,namespaces
          ports:
            - name: http
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-kube-state-metrics
  namespace: aiops
  labels:
    app.kubernetes.io/name: aiops-kube-state-metrics
    app.kubernetes.io/part-of: aiops-sre-agent
spec:
  selector:
    app.kubernetes.io/name: aiops-kube-state-metrics
  ports:
    - name: http
      port: 8080
      targetPort: http
