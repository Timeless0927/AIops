spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aiops-alloy
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aiops-prometheus
      ports:
        - protocol: TCP
          port: 12345
