apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aiops-prometheus-ingress
  namespace: aiops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aiops-prometheus
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aiops-mcp-prometheus
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aiops-alertmanager-ingress
  namespace: aiops
spec:
  podSelector:
