apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-alertmanager
  namespace: aiops
  labels:
    app.kubernetes.io/name: aiops-alertmanager
    app.kubernetes.io/part-of: aiops-sre-agent
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-alertmanager-config
  namespace: aiops
data:
  alertmanager.yml: |
    route:
      receiver: drop
      routes:
        - receiver: gateway
          matchers:
            - 'aiops_route="gateway"'
          group_by: [cluster, namespace, alertname]
          group_wait: 5s
          group_interval: 5s
    receivers:
      - name: drop
      - name: gateway
        webhook_configs:
          - url: http://aiops-gateway:8080/webhooks/alertmanager
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-alertmanager
  namespace: aiops
  labels:
    app.kubernetes.io/name: aiops-alertmanager
    app.kubernetes.io/part-of: aiops-sre-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aiops-alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiops-alertmanager
        app.kubernetes.io/part-of: aiops-sre-agent
    spec:
      serviceAccountName: aiops-alertmanager
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --data.retention=48h
            - --web.listen-address=0.0.0.0:9093
          ports:
            - name: http
              containerPort: 9093
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
              readOnly: true
            - name: runtime-token
              mountPath: /etc/alertmanager/secrets
              readOnly: true
            - name: data
              mountPath: /alertmanager
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: aiops-alertmanager-config
        - name: runtime-token
          secret:
            secretName: aiops-runtime-secret
            optional: false
            items:
              - key: AIOPS_ALERTMANAGER_WEBHOOK_TOKEN
                path: token
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-alertmanager
  namespace: aiops
  labels:
    app.kubernetes.io/name: aiops-alertmanager
    app.kubernetes.io/part-of: aiops-sre-agent
spec:
  selector:
    app.kubernetes.io/name: aiops-alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
