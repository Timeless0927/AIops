apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aiops-diagnosis-internal
  namespace: aiops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aiops-diagnosis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aiops-gateway
      ports:
        - protocol: TCP
          port: 8082
---
