    app.kubernetes.io/part-of: aiops-sre-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aiops-connector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiops-connector
        app.kubernetes.io/part-of: aiops-sre-agent
    spec:
      serviceAccountName: aiops-connector
      containers:
        - name: connector
          image: registry.cn-hangzhou.aliyuncs.com/timelessmao/aiops-connectors:latest
          imagePullPolicy: IfNotPresent
