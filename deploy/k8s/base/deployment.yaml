apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-gateway
  namespace: aiops
  labels:
    app.kubernetes.io/name: aiops-gateway
    app.kubernetes.io/part-of: aiops-sre-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aiops-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiops-gateway
        app.kubernetes.io/part-of: aiops-sre-agent
    spec:
      serviceAccountName: aiops-gateway
      containers:
        - name: gateway
          image: registry.cn-hangzhou.aliyuncs.com/timelessmao/aiops-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: aiops-runtime-config
            - secretRef:
                name: aiops-runtime-secret
                optional: true
          env:
            - name: AIOPS_IDENTITY_CONFIG
              value: /etc/aiops/identity.yaml
            - name: AIOPS_INTERNAL_TOKEN_FILE
              value: /var/run/secrets/aiops-internal/token
            - name: AIOPS_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: data
              mountPath: /data
            - name: identity-config
              mountPath: /etc/aiops/identity.yaml
              subPath: identity.yaml
              readOnly: true
            - name: internal-identity
              mountPath: /var/run/secrets/aiops-internal
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aiops-gateway-data
        - name: identity-config
          configMap:
            name: aiops-identity-config
        - name: internal-identity
          projected:
            sources:
              - serviceAccountToken:
                  audience: aiops-internal
                  expirationSeconds: 3600
                  path: token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-connector
