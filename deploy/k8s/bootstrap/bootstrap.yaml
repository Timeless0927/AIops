apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-bootstrap
  namespace: aiops-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-bootstrap
  namespace: aiops-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - aiops-runtime-secret
      - aiops-model-encryption
      - aiops-notification-encryption
      - aiops-change-encryption
      - aiops-mcp-encryption
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["aiops-bootstrap-state"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-bootstrap
  namespace: aiops-system
subjects:
  - kind: ServiceAccount
    name: aiops-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiops-bootstrap
---
apiVersion: batch/v1
kind: Job
metadata:
  name: aiops-bootstrap
  namespace: aiops-system
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiops-bootstrap
        app.kubernetes.io/part-of: aiops-sre-agent
    spec:
      serviceAccountName: aiops-bootstrap
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: registry.cn-hangzhou.aliyuncs.com/timelessmao/aiops-gateway:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "bootstrap_service"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
