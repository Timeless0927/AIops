apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-gateway-secret-readiness
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["aiops-change-encryption", "aiops-mcp-encryption", "aiops-runtime-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-gateway-secret-readiness
subjects:
  - kind: ServiceAccount
    name: aiops-gateway
    namespace: aiops-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiops-gateway-secret-readiness
---
