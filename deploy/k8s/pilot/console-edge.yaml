apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-console-edge
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $http_x_request_id;

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location ^~ /api/v1 {
        proxy_pass http://aiops-gateway:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
      }

      location ^~ /auth {
        proxy_pass http://aiops-gateway:8080;
        proxy_http_version 1.1;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
