apiVersion: v1
kind: ResourceQuota
metadata:
  name: verification-ceiling
spec:
  hard:
    pods: "5"
    count/deployments.apps: "1"
    count/jobs.batch: "1"
    requests.cpu: 500m
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: verification-container-ceiling
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 200m
        memory: 128Mi
      max:
        cpu: 200m
        memory: 128Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: verification-api
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verification-api
  labels:
    app.kubernetes.io/name: verification-api
    app.kubernetes.io/part-of: aiops-verification
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: verification-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: verification-api
        app.kubernetes.io/part-of: aiops-verification
        aiops.dev/verification-deployment: verification-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: verification-api
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verification-api
          image: registry.cn-hangzhou.aliyuncs.com/timelessmao/aiops-verification@sha256:8807dae0c68c91fd1d37f2b80fb550e5bf287cc186b94940032f2b99a21bfdb0
          imagePullPolicy: IfNotPresent
          env:
            - name: AIOPS_VERIFICATION_RUN_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['aiops.dev/verification-run-id']
          ports:
            - name: live-ready
              containerPort: 8080
            - name: trigger
              containerPort: 8081
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: live-ready
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: live-ready
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: verification-api
  labels:
    app.kubernetes.io/name: verification-api
spec:
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: verification-api
  ports:
    - name: live-ready
      port: 8080
      targetPort: live-ready
    - name: trigger
      port: 8081
      targetPort: trigger
    - name: metrics
      port: 9090
      targetPort: metrics
